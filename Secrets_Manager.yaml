AWSTemplateFormatVersion: '2010-09-09'
Description: Secrets Manager for RDS credentials with VPC endpoint

Parameters:
  DBUsername:
    Type: String
  DBPassword:
    Type: String

Resources:
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: RDSSecret
      Description: RDS Credentials
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}"
        }

  SecretsManagerVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcId: !ImportValue MyStack-VPCId
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue MyStack-PrivateSubnet1
        - !ImportValue MyStack-PrivateSubnet2
      SecurityGroupIds:
        - !ImportValue SecretsManagerSecurityGroupId

Outputs:
  DBSecretArn:
    Value: !Ref DBSecret
    Export:
      Name: MyStack-RDSSecret

  SecretsManagerVPCEndpointId:
    Value: !Ref SecretsManagerVPCEndpoint
    Export:
      Name: MyStack-SecretsManagerVPCEndpoint
