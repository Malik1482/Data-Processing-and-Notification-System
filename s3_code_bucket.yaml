AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 bucket for Lambda code upload"

Resources:
  LambdaCodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::AccountId}-lambda-code-bucket-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  BucketName:
    Value: !Ref LambdaCodeBucket
    Description: "tc_lambda_function"
